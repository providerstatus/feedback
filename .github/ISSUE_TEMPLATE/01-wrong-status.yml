name: A status looks wrong
description: A provider is shown as down, degraded or up, and that does not match reality.
title: "[status] "
labels: ["status-report", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Every figure is our own measurement: eight probe locations have
        been checking 113 endpoints since 31 August 2026. **If a number
        looks wrong to you, that is exactly the report we want** — it is
        the most valuable thing anyone can send us.

        The HTML pages are not published yet, so the numbers you can see
        today are on the text API: `curl providerstatus.sh/stripe`.

        (Until 13 October 2026 this form said the site showed mock data
        and asked you not to report it. That stopped being true on
        31 August and the sentence did not.)
  - type: input
    id: provider
    attributes:
      label: Provider
      description: The API name from the provider index, e.g. `stripe`, `hetzner`, `cloudflare`.
      placeholder: stripe
    validations:
      required: true
  - type: input
    id: when
    attributes:
      label: When you saw it (UTC)
      description: A rough timestamp is enough — raw per-location measurements stay queryable for about three months. Each endpoint is measured about once a minute.
      placeholder: 2026-10-12 14:20 UTC
    validations:
      required: true
  - type: dropdown
    id: shown
    attributes:
      label: What the page showed
      options:
        - Operational
        - Degraded
        - Partial outage
        - Full outage
        - Maintenance
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What you observed instead
      description: What were you seeing from your own side, and how did you check?
      placeholder: |
        api.stripe.com answered normally from our EU servers the whole time,
        median around 180 ms. Their own status page showed no incident either.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Anything to back it up
      description: Optional — curl output, a screenshot, a link to the provider's own incident.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: This is about our measurement, not about an outage at the provider itself.
          required: true
